[package]
name = "grammers-mtsender"
version = "0.11.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
A sender implementation using the Mobile Transport Protocol.
"""
homepage = "https://codeberg.org/Lonami/grammers"
documentation = "https://docs.rs/grammers-mtsender"
repository = "https://codeberg.org/Lonami/grammers"
keywords = ["api", "mtproto", "telegram", "tl"]
categories = ["api-bindings", "network-programming"]
edition = "2024"

[features]
default = ["os-detect"]
# `ConnectionParams::default()` reads the device model, system version and language codes from the operating system.
os-detect = ["dep:os_info", "dep:locate-locale"]
proxy = ["tokio-socks", "hickory-resolver", "url", "percent-encoding"]

[dependencies]
bytes = "1.12.1"
grammers-crypto = { path = "../grammers-crypto", version = "0.11.0" }
grammers-mtproto = { path = "../grammers-mtproto", version = "0.11.0" }
grammers-session = { path = "../grammers-session", version = "0.11.0", default-features = false }
grammers-tl-types = { path = "../grammers-tl-types", version = "0.11.0", features = [ "tl-mtproto", "deserializable-functions" ] }
locate-locale = { version = "0.2.0", optional = true }
os_info = { version = "3.15.0", default-features = false, optional = true }
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "sync", "time", "net", "macros", "rt"] }
tracing.workspace = true

tokio-socks = { version = "0.5.3", optional = true }
hickory-resolver = { version = "0.26.3", optional = true }
url = { version = "2.5.8", optional = true }
percent-encoding = { version = "2.3.2", optional = true }

[dev-dependencies]
toml = "1.1.8"
socks5-server = "0.10.1"
sha2 = "0.11.1"
tokio = { version = "1.53.3", default-features = false, features = ["test-util"] }
tracing-subscriber.workspace = true
